name: bhunte_ai
description: "Bhunte AI — Nepali-first POS for small shops"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  barcode_widget: ^2.0.4
  pdf: ^3.12.0
  printing: ^5.14.3
  mobile_scanner: ^7.4.2
  cloud_functions: ^6.5.1
  image_picker: ^1.2.3
  # Shrinks product photos on the phone. 4.11.0 calls an archive API newer than
  # pdf 3.12 allows (archive <4.1); lift the cap when moving to Flutter 3.41+ / pdf 3.13.
  image: ">=4.10.0 <4.11.0"
  camera: ^0.12.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    # Bundled (not fetched at runtime) so Devanagari renders offline.
    - family: Mukta
      fonts:
        - asset: assets/fonts/Mukta-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mukta-Medium.ttf
          weight: 500
        - asset: assets/fonts/Mukta-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mukta-Bold.ttf
          weight: 700
        - asset: assets/fonts/Mukta-ExtraBold.ttf
          weight: 800

# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "../brand/bhunte-icon-square-1024.png"
  android: true
  adaptive_icon_background: "#1D6B45"
  adaptive_icon_foreground: "../brand/bhunte-adaptive-fg-1024.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "../brand/bhunte-logo-1024.png"
    background_color: "#EEF2EF"
    theme_color: "#1D6B45"
